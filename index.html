<!DOCTYPE html>
<html>
<head>
  <title>Arch Nemesis</title>
  <style>
    body {
      font-family: Verdana, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f5f6;
      color: #2b2f33;
    }
    h1 {
      color: #2e5c8a;
      font-size: 3em;
    }
    h2 {
      color: #3d4852;
      border-bottom: 2px solid #c7ccd1;

    .team-list {
      list-style: none;

      color: #2e5c8a;
      padding: 6px 14px;
      border-radius: 999px;

    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .button-row a {
      background-color: #2e5c8a;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
    }
    .button-row a:hover {

      text-decoration: none;
